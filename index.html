<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Globevibes – Digital News &amp; Editorial Publication</title>
    <meta name="description" content="A modern, high-performance news and editorial publishing platform featuring breaking reports, comprehensive articles, and an enterprise publication suite." />
    <meta property="og:title" content="Globevibes – Digital News &amp; Editorial Publication" />
    <meta property="og:description" content="A modern, high-performance news and editorial publishing platform featuring breaking reports, comprehensive articles, and an enterprise publication suite." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
    <script>
      // 1. Normalize trailing slash for GitHub Pages repo subpaths so relative assets (./assets/...) resolve properly
      (function(l) {
        if (l.hostname.indexOf('github.io') !== -1) {
          var p = l.pathname;
          if (p && !p.endsWith('/') && p.split('/').pop().indexOf('.') === -1) {
            l.replace(l.protocol + '//' + l.host + p + '/' + (l.search || '') + (l.hash || ''));
          }
        }
      }(window.location));

      // 2. Decode redirect URL from 404.html if arriving via GitHub Pages SPA redirect
      (function(l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          var basePath = l.pathname.endsWith('/') ? l.pathname.slice(0, -1) : l.pathname;
          window.history.replaceState(null, null, basePath + decoded + l.hash);
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-stone-900 selection:text-white">
    <div id="root">
      <!-- Pre-mount fallback content with watchdog recovery to eliminate frozen loading screen -->
      <div id="pre-mount-container" style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #fafaf9; color: #1c1917; padding: 24px; text-align: center;">
        <div style="border-bottom: 2px solid #1c1917; padding-bottom: 8px; margin-bottom: 16px;">
          <h1 style="font-family: Georgia, 'Times New Roman', serif; font-size: 28px; font-weight: bold; margin: 0; letter-spacing: -0.5px;">GLOBEVIBES</h1>
        </div>
        <p id="pre-mount-status" style="font-size: 13px; color: #78716c; margin: 0; font-family: monospace;">Loading publication dispatches...</p>
        
        <div id="pre-mount-recovery" style="display: none; margin-top: 24px; max-width: 420px; animation: fadeIn 0.3s ease-in;">
          <p style="font-size: 13px; color: #b45309; background: #fef3c7; border: 1px solid #fde68a; padding: 12px; border-radius: 6px; margin-bottom: 16px; line-height: 1.4;">
            Loading is taking longer than expected. If viewing on mobile or a freshly deployed site, tap below to reload.
          </p>
          <div style="display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;">
            <button onclick="window.location.reload()" style="background-color: #1c1917; color: #ffffff; border: none; padding: 10px 20px; font-size: 13px; font-weight: 600; border-radius: 4px; cursor: pointer;">
              Reload Publication
            </button>
            <button onclick="returnToFrontPage()" style="background-color: #e7e5e4; color: #1c1917; border: none; padding: 10px 16px; font-size: 13px; font-weight: 600; border-radius: 4px; cursor: pointer;">
              Return to Front Page
            </button>
          </div>
        </div>
      </div>
    </div>

    <script>
      // Load compiled stylesheet if running on a static host (GitHub Pages, custom domain, etc.)
      (function() {
        var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.port === '3000';
        if (!isLocal) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.crossOrigin = 'anonymous';
          link.href = './assets/index.css';
          document.head.appendChild(link);
        }
      })();
    </script>
    <script>
      function returnToFrontPage() {
        var l = window.location;
        if (l.hostname.indexOf('github.io') !== -1) {
          var parts = l.pathname.split('/').filter(Boolean);
          if (parts.length > 0 && ['articles','article','category','categories','tag','search','about','contact','privacy','terms','login','admin'].indexOf(parts[0]) === -1) {
            window.location.href = '/' + parts[0] + '/';
            return;
          }
        }
        window.location.href = '/';
      }

      // Pre-mount watchdog: monitors application mounting with generous mobile network tolerance
      (function() {
        var isMounted = function() { return window.__GLOBEVIBES_MOUNTED || window.__APEX_MOUNTED; };
        
        var timer = setTimeout(function() {
          if (!isMounted()) {
            var rec = document.getElementById('pre-mount-recovery');
            var stat = document.getElementById('pre-mount-status');
            if (rec) rec.style.display = 'block';
            if (stat) stat.textContent = 'Connection or asset load delay detected';
          }
        }, 8000);

        window.addEventListener('error', function(e) {
          // Ignore expected static hosting rejection of uncompiled /src/main.tsx
          var targetSrc = (e && e.target && e.target.src) ? e.target.src : '';
          var filename = (e && e.filename) ? e.filename : '';
          if (targetSrc.indexOf('main.tsx') !== -1 || filename.indexOf('main.tsx') !== -1) {
            return;
          }
          if (isMounted()) return;
        }, true);
      })();
    </script>

    <noscript>
      <div style="padding: 24px; text-align: center; font-family: sans-serif; background-color: #fff; color: #1c1917;">
        <h2>JavaScript Required</h2>
        <p>Globevibes requires JavaScript to display interactive editorial articles and dispatches. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>

    <!-- Dual-Mode Loader: Runs Vite dev server in local development; loads compiled production bundle on static hosts -->
    <script type="module">
      var isLocalDev = window.location.hostname === 'localhost' || 
                       window.location.hostname === '127.0.0.1' || 
                       window.location.port === '3000';

      if (!isLocalDev) {
        // Running on a static server (GitHub Pages, custom domain https://globevibes.2bd.net/, etc.)
        loadCompiledBundle();
      }

      function loadCompiledBundle() {
        var candidates = [
          './assets/index.js',
          '/assets/index.js',
          './docs/assets/index.js',
          '/docs/assets/index.js'
        ];
        function tryLoad(idx) {
          if (idx >= candidates.length) {
            console.error('[Globevibes] All compiled bundle paths exhausted.');
            var rec = document.getElementById('pre-mount-recovery');
            var stat = document.getElementById('pre-mount-status');
            if (rec) rec.style.display = 'block';
            if (stat) stat.textContent = 'Unable to load application scripts. Please refresh the page.';
            return;
          }
          var path = candidates[idx];
          import(path).then(function() {
            console.log('[Globevibes] Application mounted successfully from:', path);
          }).catch(function(e) {
            console.warn('[Globevibes] Candidate ' + path + ' failed, trying next...', e);
            tryLoad(idx + 1);
          });
        }
        tryLoad(0);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
